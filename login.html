<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>France Agent IA — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f6fa;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:40px;width:400px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.logo-wrap{display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.logo-wrap img{height:36px;width:auto}
.title{font-size:20px;font-weight:600;color:#1a1d23;margin-bottom:4px;text-align:center}
.subtitle{font-size:13px;color:#9ba3af;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;color:#374151;font-weight:500;display:block;margin-bottom:6px}
.form-input{width:100%;padding:10px 12px;background:#fff;border:1px solid #d1d5db;border-radius:8px;color:#1a1d23;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border 0.12s}
.form-input:focus{border-color:#1d6bf3;box-shadow:0 0 0 3px rgba(29,107,243,0.1)}
.btn-login{width:100%;padding:11px;background:#1d6bf3;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background 0.12s;margin-top:8px}
.btn-login:hover{background:#1558d6}
.btn-login:disabled{background:#93c5fd;cursor:not-allowed}
.error{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;color:#ef4444;margin-bottom:16px;display:none}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#9ba3af}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><img src="/assets/logo.png" alt="France Agent IA"></div>
  <div class="title">Espace client</div>
  <div class="subtitle">Connectez-vous pour accéder à votre back-office</div>
  <div class="error" id="error-msg"></div>
  <div class="form-group">
    <label class="form-label">Adresse email</label>
    <input type="email" class="form-input" id="email" placeholder="votre@email.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Mot de passe</label>
    <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btn-login">Se connecter</button>
  <div class="footer">France Agent IA — Accès sécurisé</div>
</div>
<script>
var SUPA_URL = 'https://stokclikeifskbheumfj.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0b2tjbGlrZWlmc2tiaGV1bWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Njc2MzcsImV4cCI6MjA5OTU0MzYzN30.k0UbuLxR1fqgsj3-5J935E12sVSyqD_Ta6QKrbLRnR4';

document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
document.getElementById('btn-login').addEventListener('click', login);

async function login() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('btn-login');
  var err = document.getElementById('error-msg');
  if(!email||!password){showError('Veuillez remplir tous les champs.');return;}
  btn.disabled=true; btn.textContent='Connexion...'; err.style.display='none';
  try {
    var res = await fetch(SUPA_URL+'/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':ANON_KEY},
      body:JSON.stringify({email:email,password:password})
    });
    var data = await res.json();
    if(!res.ok||data.error){showError('Email ou mot de passe incorrect.');btn.disabled=false;btn.textContent='Se connecter';return;}
    sessionStorage.setItem('sb_access_token', data.access_token);
    sessionStorage.setItem('sb_user_email', data.user.email);
    window.location.href='/backoffice.html';
  } catch(e) {
    showError('Erreur réseau. Réessayez.');btn.disabled=false;btn.textContent='Se connecter';
  }
}
function showError(msg){var e=document.getElementById('error-msg');e.textContent=msg;e.style.display='block';}
</script>
</body>
</html>
